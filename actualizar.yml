name: Actualizar y publicar web
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */3 * * *'
    - cron: '*/5 14-22 * * 5,6,0'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Actualizar datos
        id: upd
        continue-on-error: true
        run: python scripts/update.py ${{ github.event.schedule == '*/5 14-22 * * 5,6,0' && '--live' || '' }}
      - name: Guardar cambios
        id: save
        run: |
          git config user.name "web-obila-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; else git commit -m "Actualizar datos" && git push && echo "changed=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/configure-pages@v5
        if: github.event.schedule != '*/5 14-22 * * 5,6,0' || steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event.schedule != '*/5 14-22 * * 5,6,0' || steps.save.outputs.changed == 'true'
        with:
          path: '.'
      - id: deployment
        if: github.event.schedule != '*/5 14-22 * * 5,6,0' || steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Avisar si falló la lectura de la FEB
        if: steps.upd.outcome == 'failure'
        run: exit 1
